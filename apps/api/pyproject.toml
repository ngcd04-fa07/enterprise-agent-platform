[project]
name = "enterprise-agent-api"
version = "0.1.0"
description = "FastAPI backend for the Enterprise Agent Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "moto[s3]>=5.0",
    "boto3-stubs[s3]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
# S101 (assert) fires on every pytest `assert` — that's how pytest tests
# are written, not a real risk in a test file. S105/S106/S107 (possible
# hardcoded password/secret) fire on this project's own test fixtures and
# fake credentials (e.g. "correct horse battery staple", fake session
# tokens) — genuinely not secrets, just string literals that happen to
# match the heuristic. Reviewed per-finding, not a blanket "S is noisy,
# disable it": every other S rule stays enabled, including in tests.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]
"evals/*" = ["S101", "S105", "S106", "S107"]
"benchmarks/*" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
