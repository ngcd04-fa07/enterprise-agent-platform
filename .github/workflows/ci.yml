name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: enterprise_agent
          POSTGRES_PASSWORD: enterprise_agent
          POSTGRES_DB: enterprise_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy app
      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://enterprise_agent:enterprise_agent@localhost:5432/enterprise_agent
          SESSION_SECRET: ci-test-secret-with-at-least-32-characters
      - name: Eval regression-comparison tests (Stage 18)
        # Pure logic, no DB/app dependency at all (evals/comparison.py) —
        # can run at any point in the job, but grouped here with the other
        # eval-related steps. Not folded into apps/api's own `pytest`
        # (scoped to apps/api/tests only) to avoid a reverse-direction
        # import (apps/api/tests -> top-level evals/, when every other
        # import in this repo goes the other way).
        working-directory: ${{ github.workspace }}
        run: pytest evals/
      - name: Eval harness smoke test
        # Must run before "Test (pytest)", not after: pytest's session-
        # scoped db_engine fixture drops every table at teardown (see
        # tests/conftest.py), so running this afterward would hit the
        # documented "relation does not exist" gotcha even though
        # alembic_version still (wrongly) claims the schema is at head.
        # Runs from the repo root (not apps/api) so `evals` resolves as a
        # package; reuses the dependencies just installed above via
        # evals/*'s own sys.path insert — no separate install step needed.
        # Exercises the real eval harness wiring (dataset loading, fixture
        # seeding, scoring/judging, and — Stage 18 — recording/comparing/
        # persisting two runs) against a deterministic fake model, not
        # real Ollama (unavailable in CI) — see evals/smoke_test.py.
        working-directory: ${{ github.workspace }}
        run: python3 -m evals.smoke_test
        env:
          DATABASE_URL: postgresql+asyncpg://enterprise_agent:enterprise_agent@localhost:5432/enterprise_agent
          SESSION_SECRET: ci-test-secret-with-at-least-32-characters
      - name: Test (pytest)
        run: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://enterprise_agent:enterprise_agent@localhost:5432/enterprise_agent
          SESSION_SECRET: ci-test-secret-with-at-least-32-characters
      - name: Dependency audit (pip-audit)
        # Blocking (Stage 20): a real finding here is an exploitable
        # dependency vulnerability, not ecosystem noise — this project's
        # backend dependency tree is small and has no accepted findings
        # today. If one shows up that's genuinely unfixable/inapplicable,
        # document it explicitly here rather than silencing the whole
        # step.
        run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Dependency audit (npm audit)
        # Non-blocking, deliberately (Stage 20) — not because audit
        # findings don't matter, but because the two current findings
        # (postcss XSS/path-traversal, sharp/libvips CVEs) are both
        # transitive dependencies of `next` with no fix available short
        # of a next@16 major upgrade (confirmed: even the latest next@15.x
        # patch still bundles the same vulnerable postcss/sharp — `npm
        # audit fix --force` is the only automated path npm offers, and
        # this project does not take that path just to zero out a number).
        # Neither is reachable through this app's actual runtime surface:
        # postcss only runs at build time, and sharp is next/image's
        # optional runtime image-optimizer, which this app doesn't use
        # anywhere (grepped: no `next/image` import in apps/web/src).
        # `continue-on-error` keeps this visible on every run (a genuinely
        # new/different finding still shows in the log for a human to
        # read) without failing CI on a known, accepted, non-exploitable
        # gap — the alternative is a permanently-red check that teaches
        # everyone to ignore it, which is worse than not running it.
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          cat > .env <<EOF
          POSTGRES_USER=enterprise_agent
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=enterprise_agent
          SESSION_SECRET=ci-test-session-secret-32-chars-min
          EOF
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q '"database":"ok"'; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs
          exit 1
      - name: Check web app serves the landing page
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 | grep -q "Enterprise Agent Platform"; then
              echo "Web app serving"
              exit 0
            fi
            sleep 2
          done
          echo "Web app did not come up in time"
          docker compose logs
          exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
