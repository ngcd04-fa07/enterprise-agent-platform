services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_agent}
      # No silent weak default (Stage 20) — matches SESSION_SECRET's
      # existing fail-loudly pattern below. A missing .env value used to
      # fall back to the literal password published in this repo.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_agent}
    ports:
      # Bound to localhost only (Stage 20) — this is a local dev/demo
      # compose file, not a deployment topology with its own network
      # boundary; the previous "5432:5432" published Postgres to every
      # interface on the host by default. Still reachable at
      # localhost:5432 for local `psql`/tooling.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enterprise_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stage 21: migrations run exactly once, as their own short-lived
  # service, not baked into the api container's boot command. With
  # migrations in the api CMD (as before), scaling `api` to N replicas
  # means N containers race to run `alembic upgrade head` concurrently
  # against the same database — fine today (this compose file always
  # runs exactly one api replica), but a real multi-replica-safe
  # baseline shouldn't depend on that never changing. `api` now waits
  # for this to *complete successfully* before starting, so it never
  # races its own migration step either.
  migrate:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-enterprise_agent}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-enterprise_agent}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-enterprise_agent}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-enterprise_agent}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      ENVIRONMENT: development
      STORAGE_ROOT: /data/documents
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/data/documents
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      args:
        API_ORIGIN: http://api:8000
        # Must be a build arg, not just the environment: entry below —
        # see the Dockerfile's comment on why (same rewrites()/headers()
        # baked-at-build-time behavior as API_ORIGIN).
        ENVIRONMENT: development
        # Off for local dev/CI — only the public demo deployment sets
        # this to "true" (see docs/deployment.md).
        NEXT_PUBLIC_DEMO_MODE: "false"
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:8000
      ENVIRONMENT: development
      NEXT_PUBLIC_DEMO_MODE: "false"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  document_storage:
