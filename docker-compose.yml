services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enterprise_agent}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_agent}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enterprise_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-enterprise_agent}:${POSTGRES_PASSWORD:-enterprise_agent}@db:5432/${POSTGRES_DB:-enterprise_agent}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      ENVIRONMENT: development
      STORAGE_ROOT: /data/documents
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/data/documents
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  document_storage:
